name: update-herdr-server

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release tag override (example: v0.1.0). Leave empty for the latest GitHub release."
        required: false
        type: string
  # Weekly is plenty: launcher releases are rare and each upgrade re-prompts the
  # Local Network grant, so a human still merges the PR this opens.
  schedule:
    - cron: "0 8 * * 1"  # every Monday at 08:00 UTC

jobs:
  # Bumps the cask and freezes it as an artifact. Read-only token and no persisted git
  # credentials, so nothing that touches the upstream release can push or open PRs.
  # No install step: the cask pulls in the herdr formula and needs a macOS runner, and
  # test-bot runs on the PR.
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@24728b77430f9659b8d89068e4afe7f5fd0f973c # main

      - name: Link the checkout as the tap
        # Tap-qualified brew commands (style/audit below) resolve through Homebrew's taps
        # dir, not the workspace. Symlink this checkout in so they validate exactly the cask
        # the updater just wrote here — not a remote or pre-tapped copy.
        run: |
          tap_dir="$(brew --repository)/Library/Taps/drod3763/homebrew-tap"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Update cask
        env:
          # Read-only here (job is contents: read); only lifts the API rate limit for the
          # latest-release lookup.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never interpolate the dispatch input into the script text: a caller could
          # break out of the quotes. Bind it as an env var and expand it quoted.
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/update-herdr-server.sh "$VERSION"
          else
            scripts/update-herdr-server.sh
          fi

      - name: Validate cask
        run: brew style --cask drod3763/tap/herdr-server && brew audit --cask --strict drod3763/tap/herdr-server

      - name: Read updated version
        id: read_version
        run: |
          VERSION="$(ruby -e 'content = File.read("Casks/herdr-server.rb"); puts content[/version "([^"]+)"/, 1]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload cask
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: herdr-server-cask
          path: Casks/herdr-server.rb
          if-no-files-found: error

  # Write-enabled, but never installs Homebrew or touches the upstream release. Commits
  # only the cask artifact that `resolve` validated.
  pull-request:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download cask
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: herdr-server-cask
          path: Casks

      - name: Check version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Unexpected version: $VERSION" >&2
            exit 1
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # PAT so test-bot runs on the PR without manual approval (GITHUB_TOKEN-opened
          # PRs are held at action_required). Falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.TAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: update-herdr-server-${{ needs.resolve.outputs.version }}
          title: "herdr-server ${{ needs.resolve.outputs.version }}"
          commit-message: "herdr-server ${{ needs.resolve.outputs.version }}"
          add-paths: Casks/herdr-server.rb
          body: |
            Automated update for `Casks/herdr-server.rb`.

            - updates version
            - refreshes SHA256 value
