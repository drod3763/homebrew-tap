name: update-amphetamine-power-protect

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional commit SHA to pin (40 hex chars). Leave empty for the latest commit touching the DMG."
        required: false
        type: string
  schedule:
    - cron: "0 9 * * 1"  # weekly Monday at 09:00 UTC

jobs:
  update:
    # macOS runner so the updater can mount the DMG and verify the pkg/receipt contract
    # (hdiutil/pkgutil) before opening a PR — a Linux runner cannot mount an Apple DMG.
    runs-on: macos-14
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Don't persist the write-capable job token in .git/config: this workspace parses
          # an upstream-controlled DMG (hdiutil/pkgutil), so a parser exploit must not be able
          # to recover repo-write credentials from git config. Nothing here pushes from the
          # workspace — create-pull-request below authenticates with its own token.
          persist-credentials: false

      - name: Set up Homebrew
        # Pinned to a full commit SHA (not the mutable @main branch): this job holds a
        # write-capable GITHUB_TOKEN, so an unexpected change on that external branch must
        # not run here. Bump deliberately when updating the action.
        uses: Homebrew/actions/setup-homebrew@24728b77430f9659b8d89068e4afe7f5fd0f973c # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update cask
        # Pass inputs through env, never interpolate ${{ }} into the shell body: GitHub
        # evaluates expressions before the shell parses the script, so a crafted commit
        # input could otherwise break quoting and run arbitrary commands. The script's own
        # 40-hex SHA validation then rejects anything malformed.
        env:
          # Deliberately NOT exposing GITHUB_TOKEN here: this step downloads and parses an
          # upstream-controlled DMG (hdiutil/pkgutil), so a parser exploit must not be able to
          # exfiltrate a write-capable repo token from the step environment. The single GitHub
          # API call (commit lookup) runs unauthenticated — fine for one request per run — and
          # the create-pull-request step below still receives the token in its own environment.
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT" ]; then
            scripts/update-amphetamine-power-protect.sh "$COMMIT"
          else
            scripts/update-amphetamine-power-protect.sh
          fi

      - name: Validate cask
        run: brew style --cask drod3763/tap/amphetamine-power-protect && brew audit --cask --strict drod3763/tap/amphetamine-power-protect

      - name: Install / uninstall smoke test
        # Style/audit never install the pkg, so they can't prove the privileged install
        # actually works or that uninstall removes the sudoers grant. This cask installs a
        # root-running, sudoers-writing pkg; exercise it end to end on the arm64 runner
        # (which has passwordless sudo, so the notarized pkg installs headlessly) and assert
        # the sudoers drop-in is created on install and gone after uninstall. Fails the PR if
        # the pkg can't install or leaves privileged state behind.
        env:
          SUDOERS: /private/etc/sudoers.d/amphetamine_PowerProtect
        run: |
          brew install --cask drod3763/tap/amphetamine-power-protect
          test -f "$SUDOERS" || { echo "sudoers drop-in was not installed at $SUDOERS"; exit 1; }
          brew uninstall --cask drod3763/tap/amphetamine-power-protect
          test ! -e "$SUDOERS" || { echo "sudoers drop-in survived uninstall at $SUDOERS"; exit 1; }
          echo "install/uninstall verified: sudoers drop-in created then removed"

      - name: Read updated version
        id: read_version
        run: |
          VERSION="$(ruby -e 'content = File.read("Casks/amphetamine-power-protect.rb"); puts content[/version "([^"]+)"/, 1]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        # Pinned to a full commit SHA (not the mutable @v7 tag): this third-party action
        # runs with the job's write-capable GITHUB_TOKEN, so a retagged/compromised release
        # must not execute here. Bump deliberately when updating the action.
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: update-amphetamine-power-protect-${{ steps.read_version.outputs.version }}
          title: "amphetamine-power-protect ${{ steps.read_version.outputs.version }}"
          commit-message: "amphetamine-power-protect ${{ steps.read_version.outputs.version }}"
          body: |
            Automated update for `Casks/amphetamine-power-protect.rb`.

            - repins the DMG URL to the latest commit touching the installer
            - updates the date-based version
            - refreshes SHA256 value
