name: update-amphetamine-power-protect

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional commit SHA to pin (40 hex chars). Leave empty for the latest commit touching the DMG."
        required: false
        type: string
  schedule:
    - cron: "0 9 * * 1"  # weekly Monday at 09:00 UTC

jobs:
  update:
    # macOS runner so the updater can mount the DMG and verify the pkg/receipt contract
    # (hdiutil/pkgutil) before opening a PR — a Linux runner cannot mount an Apple DMG.
    runs-on: macos-14
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Homebrew
        # Pinned to a full commit SHA (not the mutable @main branch): this job holds a
        # write-capable GITHUB_TOKEN, so an unexpected change on that external branch must
        # not run here. Bump deliberately when updating the action.
        uses: Homebrew/actions/setup-homebrew@24728b77430f9659b8d89068e4afe7f5fd0f973c # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update cask
        # Pass inputs through env, never interpolate ${{ }} into the shell body: GitHub
        # evaluates expressions before the shell parses the script, so a crafted commit
        # input could otherwise break quoting and run arbitrary commands. The script's own
        # 40-hex SHA validation then rejects anything malformed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT" ]; then
            scripts/update-amphetamine-power-protect.sh "$COMMIT"
          else
            scripts/update-amphetamine-power-protect.sh
          fi

      - name: Validate cask
        run: brew style --cask drod3763/tap/amphetamine-power-protect && brew audit --cask --strict drod3763/tap/amphetamine-power-protect

      - name: Read updated version
        id: read_version
        run: |
          VERSION="$(ruby -e 'content = File.read("Casks/amphetamine-power-protect.rb"); puts content[/version "([^"]+)"/, 1]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        # Pinned to a full commit SHA (not the mutable @v7 tag): this third-party action
        # runs with the job's write-capable GITHUB_TOKEN, so a retagged/compromised release
        # must not execute here. Bump deliberately when updating the action.
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: update-amphetamine-power-protect-${{ steps.read_version.outputs.version }}
          title: "amphetamine-power-protect ${{ steps.read_version.outputs.version }}"
          commit-message: "amphetamine-power-protect ${{ steps.read_version.outputs.version }}"
          body: |
            Automated update for `Casks/amphetamine-power-protect.rb`.

            - repins the DMG URL to the latest commit touching the installer
            - updates the date-based version
            - refreshes SHA256 value
