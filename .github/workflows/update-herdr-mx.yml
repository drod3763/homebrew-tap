name: update-herdr-mx

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release tag (example: v0.7.1-mx.1). Leave empty for latest release."
        required: false
        type: string
  schedule:
    - cron: "0 9 * * 1"  # every Monday at 09:00 UTC

jobs:
  # Freeze the target release ONCE so every downstream job acts on the same immutable
  # tag. Without this, each scheduled job would re-resolve "latest" independently and a
  # release published mid-run could be opened as a PR without having been validated.
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            tag="$VERSION"
          else
            tag="$(curl -fsSL "https://api.github.com/repos/drod3763/herdr-mx/releases/latest" |
              ruby -rjson -e 'puts JSON.parse($stdin.read).fetch("tag_name")')"
          fi
          echo "Resolved target tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Run the (deterministic) updater pinned to the frozen tag on every shipped platform
  # and exercise the real install + `herdr --version` path. PRs opened by the default
  # GITHUB_TOKEN do not trigger the pull_request test-bot workflow, so this matrix is
  # the actual gate — the PR is only opened if every platform's asset installs and runs.
  # Covers all four shipped assets: Linux x86_64/aarch64 and macOS x86_64/aarch64.
  validate:
    needs: resolve
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formula
        run: scripts/update-herdr-mx.sh "${{ needs.resolve.outputs.tag }}"

      - name: Validate formula
        run: brew style --formula drod3763/tap/herdr-mx && brew audit --strict drod3763/tap/herdr-mx

      - name: Install and test formula
        run: |
          brew install --formula drod3763/tap/herdr-mx
          brew test drod3763/tap/herdr-mx

      # Upload the exact validated formula from one leg so open-pr commits these precise
      # bytes rather than re-running detection (which could pick up swapped assets).
      - name: Upload validated formula
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: herdr-mx-formula
          path: Formula/herdr-mx.rb
          if-no-files-found: error

  open-pr:
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Commit the exact formula the matrix validated — do not re-resolve or re-run the
      # updater here, so the published PR can only ever contain validated artifacts.
      - name: Download validated formula
        uses: actions/download-artifact@v4
        with:
          name: herdr-mx-formula
          path: Formula

      - name: Read updated version
        id: read_version
        run: |
          VERSION="$(ruby -e 'content = File.read("Formula/herdr-mx.rb"); puts content[/version "([^"]+)"/, 1]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-herdr-mx-${{ steps.read_version.outputs.version }}
          title: "herdr-mx ${{ steps.read_version.outputs.version }}"
          commit-message: "herdr-mx ${{ steps.read_version.outputs.version }}"
          body: |
            Automated update for `Formula/herdr-mx.rb`.

            - updates release asset URLs
            - refreshes the four per-platform SHA256 values
            - validated by install + test on Linux x86_64/aarch64 and macOS x86_64/aarch64
