name: update-humble-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version tag (example: v0.23.2). Leave empty for latest release."
        required: false
        type: string
  schedule:
    - cron: "0 8 * * 1"  # every Monday at 08:00 UTC

jobs:
  # Bumps the formula and freezes it as an artifact. Read-only token, no persisted git
  # credentials, and no upstream code runs here.
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@24728b77430f9659b8d89068e4afe7f5fd0f973c # main

      - name: Update formula
        env:
          # Read-only here (job is contents: read); only lifts the API rate limit for the
          # latest-release lookup.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/update-humble-cli.sh "$VERSION"
          else
            scripts/update-humble-cli.sh
          fi

      - name: Validate formula
        run: brew style --formula drod3763/tap/humble-cli && brew audit --strict drod3763/tap/humble-cli

      - name: Read updated version
        id: read_version
        run: |
          VERSION="$(ruby -e 'content = File.read("Formula/humble-cli.rb"); puts content[%r{/tags/(v[^"]+)\.tar}, 1]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: humble-cli-formula
          path: Formula/humble-cli.rb
          if-no-files-found: error

  # Builds and tests the frozen formula on every platform test-bot covers. PRs opened with
  # GITHUB_TOKEN don't trigger tests.yml automatically, so this matrix is the real gate.
  # It runs upstream code (build, completion generation, `brew test`), so it stays read-only.
  validate:
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@24728b77430f9659b8d89068e4afe7f5fd0f973c # main

      - name: Use generated formula
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: humble-cli-formula
          path: Formula

      - name: Build and test formula
        run: |
          brew install --build-from-source drod3763/tap/humble-cli
          brew test drod3763/tap/humble-cli

  # Write-enabled, but never installs Homebrew or executes upstream code. Commits only the
  # formula artifact that `validate` tested.
  pull-request:
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download formula
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: humble-cli-formula
          path: Formula

      - name: Check version
        id: check_version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unexpected version: $VERSION" >&2
            exit 1
          fi
          # Homebrew's bump format is `<name> <version>` with the bare version.
          echo "bare=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: update-humble-cli-${{ needs.resolve.outputs.version }}
          title: "humble-cli ${{ steps.check_version.outputs.bare }}"
          commit-message: "humble-cli ${{ steps.check_version.outputs.bare }}"
          add-paths: Formula/humble-cli.rb
          body: |
            Automated update for `Formula/humble-cli.rb`.

            - updates source tarball URL
            - refreshes SHA256 value
