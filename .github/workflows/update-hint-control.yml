name: update-hint-control

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release tag override (example: 1.17.3). Leave empty for the latest GitHub release."
        required: false
        type: string
      allow_downgrade:
        description: "Allow pinning a version older than the current cask (explicit rollback)."
        required: false
        type: boolean
        default: false
  # Weekly is plenty: the app auto-updates itself, so the cask only needs to keep
  # fresh installs current.
  schedule:
    - cron: "0 8 * * 1"  # every Monday at 08:00 UTC

# One run at a time, so the open-PR checksum check below always sees the branch as the
# previous run left it and its push cannot race another run's. Queued, not cancelled
# mid-run (GitHub keeps at most one pending run; a superseded pending run never starts).
concurrency:
  group: update-hint-control
  cancel-in-progress: false

jobs:
  # Bumps the cask and freezes it as an artifact. Read-only token and no persisted git
  # credentials, so nothing that touches the upstream release can push or open PRs.
  # No install step: casks need a macOS runner, and the GitHub asset digest check in the
  # updater already pins integrity.
  # Style/audit is the only gate; test-bot's install step (`--only-formulae`) doesn't
  # install casks either.
  resolve:
    # Only from main: the guards compare against main, and the PR must be built on it. A
    # dispatch from another branch would otherwise base the update branch on that history.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@24728b77430f9659b8d89068e4afe7f5fd0f973c # main

      - name: Link the checkout as the tap
        # Tap-qualified brew commands (style/audit below) resolve through Homebrew's taps
        # dir, not the workspace. Symlink this checkout in so they validate exactly the cask
        # the updater just wrote here — not a remote or pre-tapped copy.
        run: |
          tap_dir="$(brew --repository)/Library/Taps/drod3763/homebrew-tap"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Update cask
        env:
          # Read-only here (job is contents: read); only lifts the API rate limit for the
          # release and asset-digest lookups.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never interpolate the dispatch input into the script text: a caller could
          # break out of the quotes. Bind it as an env var and expand it quoted.
          VERSION: ${{ inputs.version }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          # The updater refuses to move the cask to an older version unless opted in.
          if [ "$ALLOW_DOWNGRADE" = "true" ]; then
            export HINT_CONTROL_ALLOW_DOWNGRADE=1
          fi
          if [ -n "$VERSION" ]; then
            scripts/update-hint-control.sh "$VERSION"
          else
            scripts/update-hint-control.sh
          fi

      - name: Validate cask
        run: brew style --cask drod3763/tap/hint-control && brew audit --cask --strict drod3763/tap/hint-control

      - name: Read updated version
        id: read_version
        run: |
          VERSION="$(ruby -e 'content = File.read("Casks/hint-control.rb"); puts content[/version "([^"]+)"/, 1]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload cask
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hint-control-cask
          path: Casks/hint-control.rb
          if-no-files-found: error

  # Write-enabled, but never installs Homebrew or touches the upstream release. Commits
  # only the cask artifact that `resolve` validated.
  pull-request:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download cask
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hint-control-cask
          path: Casks

      - name: Check version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Unexpected version: $VERSION" >&2
            exit 1
          fi

      - name: Recheck against the current main
        # Both jobs check out the triggering commit, and a re-run of a failed run reuses it,
        # so main may have moved on since the updater compared versions. Repeat its
        # downgrade and same-version rules against main as it is now.
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          git fetch --depth=1 origin refs/heads/main
          base="$(git show FETCH_HEAD:Casks/hint-control.rb)"
          base_version="$(grep -Eo 'version "[^"]+"' <<<"$base" | head -1 | cut -d'"' -f2)"
          if [[ ! "$base_version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Unexpected version on main: $base_version" >&2
            exit 1
          fi
          shas() { grep -Eo '(arm|intel):[[:space:]]+"[0-9a-f]{64}"' | tr -s ' '; }
          if [ "$VERSION" = "$base_version" ]; then
            if [ "$(shas <<<"$base")" != "$(shas < Casks/hint-control.rb)" ]; then
              echo "::error::main already pins ${VERSION} with different checksums; upstream may have replaced an asset. Edit the cask by hand."
              exit 1
            fi
          elif [ "$(printf '%s\n%s\n' "$VERSION" "$base_version" | sort -V | head -1)" = "$VERSION" ] && [ "$ALLOW_DOWNGRADE" != "true" ]; then
            echo "::error::main is already at ${base_version}; refusing to propose ${VERSION} without allow_downgrade."
            exit 1
          fi

      - name: Refuse to re-pin an open update PR
        id: open_pr
        # The updater only compares against the base cask, so if a PR for this version is
        # already open and upstream has since replaced a zip, this run would silently reset
        # that PR's branch to the new checksums. Hold it to the same rule as a merged pin:
        # changed bytes under an existing version need a deliberate manual edit. When the
        # pins match, leave the branch alone: resetting it would erase any manual fixes
        # pushed to that PR.
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          branch="update-hint-control-${VERSION}"
          rc=0
          git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "No open update branch for ${VERSION}."
            exit 0
          elif [ "$rc" -ne 0 ]; then
            echo "Could not query origin for ${branch} (exit ${rc})" >&2
            exit 1
          fi
          git fetch --depth=1 origin "refs/heads/${branch}"
          shas() { grep -Eo '(arm|intel):[[:space:]]+"[0-9a-f]{64}"' | tr -s ' '; }
          pinned="$(git show FETCH_HEAD:Casks/hint-control.rb | shas)"
          fresh="$(shas < Casks/hint-control.rb)"
          if [ -z "$pinned" ] || [ "$pinned" != "$fresh" ]; then
            echo "::error::${branch} already proposes different checksums for ${VERSION}; upstream may have replaced an asset. Review and edit that PR by hand."
            printf 'open PR:\n%s\nthis run:\n%s\n' "$pinned" "$fresh" >&2
            exit 1
          fi
          echo "${branch} already pins these checksums; leaving it untouched."
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.open_pr.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # PAT so test-bot runs on the PR without manual approval (GITHUB_TOKEN-opened
          # PRs are held at action_required). Falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.TAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: update-hint-control-${{ needs.resolve.outputs.version }}
          title: "hint-control ${{ needs.resolve.outputs.version }}"
          commit-message: "hint-control ${{ needs.resolve.outputs.version }}"
          add-paths: Casks/hint-control.rb
          body: |
            Automated update for `Casks/hint-control.rb`.

            - updates version
            - refreshes SHA256 value
