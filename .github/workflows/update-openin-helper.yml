name: update-openin-helper

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (example: 4.3.5). Leave empty for latest stable appcast release."
        required: false
        type: string

jobs:
  # Bumps the cask and freezes it as an artifact. Read-only token and no persisted git
  # credentials, so nothing that touches the upstream download can push or open PRs.
  # No install step: the app needs a macOS Sequoia runner. Style/audit is the only gate;
  # test-bot's install step (`--only-formulae`) doesn't install casks either.
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@24728b77430f9659b8d89068e4afe7f5fd0f973c # main

      - name: Update cask
        env:
          # Never interpolate the dispatch input into the script text: a caller could
          # break out of the quotes. Bind it as an env var and expand it quoted.
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/update-openin-helper.sh "$VERSION"
          else
            scripts/update-openin-helper.sh
          fi

      - name: Validate cask
        run: brew style --cask drod3763/tap/openin-helper && brew audit --cask --strict drod3763/tap/openin-helper

      - name: Read updated version
        id: read_version
        run: |
          VERSION="$(ruby -e 'content = File.read("Casks/openin-helper.rb"); puts content[/version "([^"]+)"/, 1]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload cask
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openin-helper-cask
          path: Casks/openin-helper.rb
          if-no-files-found: error

  # Write-enabled, but never installs Homebrew or touches the upstream download. Commits
  # only the cask artifact that `resolve` validated.
  pull-request:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download cask
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openin-helper-cask
          path: Casks

      - name: Check version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unexpected version: $VERSION" >&2
            exit 1
          fi

      - name: Constrain the cask diff to version/sha256 changes
        # The version comes from an upstream appcast. Refuse the artifact unless every
        # changed line is exactly one well-formed `version` or `sha256` line, so nothing
        # else can reach the commit even if the updater let bad input through.
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # --text so a NUL byte (where Ruby stops parsing) can't turn the change into
          # a hunk-less "Binary files differ" diff.
          diff="$(git diff --text -U0 -- Casks/openin-helper.rb)"
          # A real change has at least one hunk and only plain content-diff headers. Refuse
          # mode, rename, binary and other metadata-only diffs, which have no `@@` lines.
          if [ -n "$diff" ]; then
            bad_header="$(printf '%s\n' "$diff" | awk '/^@@/ { exit } { print }' \
              | grep -vE '^diff --git ' | grep -vE '^index [0-9a-f]+\.\.[0-9a-f]+ 100644$' \
              | grep -vE '^--- a/' | grep -vE '^\+\+\+ b/' || true)"
            if [ -n "$bad_header" ] || ! printf '%s\n' "$diff" | grep -q '^@@'; then
              echo "Cask diff is not a plain content change, refusing:" >&2
              printf '%s\n' "$diff" | awk '/^@@/ { exit } { print }' >&2
              exit 1
            fi
          fi
          # Skip only the file header (everything before the first hunk). Filtering on a
          # `+++`/`---` prefix would also drop content lines like `++system(...)`.
          changed="$(printf '%s\n' "$diff" | awk '/^@@/ { hunk = 1; next } hunk && /^[+-]/')"
          illegal="$(printf '%s\n' "$changed" | grep -v '^$' \
            | grep -vE '^[+-]  version "[0-9]+(\.[0-9]+)*"$' \
            | grep -vE '^[+-]  sha256 "[0-9a-f]{64}"$' || true)"
          if [ -n "$illegal" ]; then
            echo "Cask changed lines other than version/sha256, refusing:" >&2
            printf '%s\n' "$illegal" >&2
            exit 1
          fi
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qxF "+  version \"$VERSION\""; then
            echo "Cask version line does not match $VERSION, refusing." >&2
            exit 1
          fi
          for kind in version sha256; do
            adds="$(printf '%s\n' "$changed" | grep -cE "^\+  ${kind} " || true)"
            dels="$(printf '%s\n' "$changed" | grep -cE "^-  ${kind} " || true)"
            if [ "$adds" != "$dels" ] || [ "$adds" -gt 1 ]; then
              echo "Expected at most one changed ${kind} line (got +${adds}/-${dels}), refusing." >&2
              exit 1
            fi
          done

      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # PAT so test-bot runs on the PR without manual approval (GITHUB_TOKEN-opened
          # PRs are held at action_required). Falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.TAP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: update-openin-helper-${{ needs.resolve.outputs.version }}
          title: "openin-helper ${{ needs.resolve.outputs.version }}"
          commit-message: "openin-helper ${{ needs.resolve.outputs.version }}"
          add-paths: Casks/openin-helper.rb
          body: |
            Automated update for `Casks/openin-helper.rb`.

            - updates version
            - refreshes SHA256 value
