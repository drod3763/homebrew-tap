name: test-amphetamine-power-protect

# Gate every PR that touches the privileged, sudoers-writing cask. A real `brew install`
# can't run in CI — the pkg's own installation-check refuses to install unless Amphetamine.app
# is present — so instead of installing, this verifies the pinned DMG against the full updater
# contract (notarization, Developer ID, receipt set, installer script + payload + sudoers
# pins) plus style/audit. That catches a broken pkg path / receipt id / uninstall stanza, or a
# DMG whose privileged scripts/sudoers changed, before it can reach main.
on:
  pull_request:
    paths:
      - Casks/amphetamine-power-protect.rb
      - .github/workflows/test-amphetamine-power-protect.yml

# Read-only: this job only inspects an upstream pkg and needs no repo write access.
permissions:
  contents: read

jobs:
  verify:
    # macOS runner: the contract verification mounts and expands the DMG (hdiutil/pkgutil),
    # which a Linux runner cannot do.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@24728b77430f9659b8d89068e4afe7f5fd0f973c # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Link the checkout as the tap
        # brew style/audit require a tap-qualified name (path-based audit is disabled), so
        # symlink this PR's checkout into Homebrew's taps dir. The brew commands below then
        # resolve drod3763/tap/... to exactly the code under review.
        run: |
          tap_dir="$(brew --repository)/Library/Taps/drod3763/homebrew-tap"
          rm -rf "$tap_dir"                       # replace any remote-tapped copy the runner set up
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Style and audit
        run: |
          brew style --cask drod3763/tap/amphetamine-power-protect
          brew audit --cask --strict drod3763/tap/amphetamine-power-protect

      - name: Verify the pinned DMG against the full contract
        # style/audit don't check the updater's deep guarantees (notarization, Developer ID,
        # receipt set, installer script + payload + sudoers pins). Re-run the updater for the
        # commit this cask pins: it re-verifies that DMG against every pin and regenerates the
        # cask. A legitimate, fully-verified pin reproduces the cask byte-for-byte; a tampered
        # version/sha or a DMG whose scripts/sudoers/receipts changed makes the updater fail or
        # produce a diff. This gives a hand-edited PR the same guarantees as an automated update.
        #
        # Trust boundary: this runs the updater/verifier from the PR checkout, so a PR that
        # edits scripts/update-amphetamine-power-protect.sh could also weaken the checks. That
        # is unavoidable in a self-hosted verifier (running the base copy instead would reject
        # every legitimate digest re-baseline, which lives in that same script). Changes to the
        # updater/verifier are security-critical and gated by human review — the auto-update
        # PRs never touch it, so for them this check is fully trustworthy.
        run: |
          commit="$(sed -n 's/^[[:space:]]*version "[^,]*,\([0-9a-f]\{40\}\)".*/\1/p' \
            Casks/amphetamine-power-protect.rb | head -1)"
          if [ -z "$commit" ]; then
            echo "Could not read the pinned commit from the cask version." >&2
            exit 1
          fi
          scripts/update-amphetamine-power-protect.sh "$commit"
          if ! git diff --quiet -- Casks/amphetamine-power-protect.rb; then
            echo "Cask does not match the updater's verified output for pinned commit $commit:" >&2
            git --no-pager diff -- Casks/amphetamine-power-protect.rb >&2
            exit 1
          fi
          echo "Pinned DMG passes the full contract and the cask matches the updater's output."
